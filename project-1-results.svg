<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">A split error before and after correction</title>
<desc id="d">Top row: one neuron returned as two unconnected fragments, because its process thins below the resolution of the imaging on one slice. Bottom row: the same five slices after the fragments were joined on the evidence of morphological continuity.</desc>
<style>
  .lbl{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#1c1b19}
  .sub{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;fill:#6b6763}
  .z{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#8c877f}
  .tag{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:#1c1b19;font-weight:600}
  .tagg{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:#a07d1f;font-weight:700}
  .note{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .frame{fill:#fdfcfa;stroke:#d9d4cc;stroke-width:1}
  .frameBad{fill:#fdfcfa;stroke:#a07d1f;stroke-width:1.6}
  .f1{fill:#e4dfd6;stroke:#1c1b19;stroke-width:1.4}
  .f2{fill:#ffffff;stroke:#1c1b19;stroke-width:1.4}
  .one{fill:#f2e2bb;stroke:#a07d1f;stroke-width:1.6}
  .ghost{fill:none;stroke:#c4bdb1;stroke-width:1.3;stroke-dasharray:2 3}
  .link{fill:none;stroke:#a07d1f;stroke-width:1.4;stroke-dasharray:4 3}
</style>

<!-- ============ BEFORE ============ -->
<text class="lbl" x="0" y="14">As the algorithm returned it</text>
<text class="sub" x="176" y="14">two fragments</text>

<g transform="translate(0,26)">
  <rect class="frame" x="0" y="0" width="64" height="78"/>
  <text class="z" x="1" y="92">z</text>
  <ellipse class="f1" cx="32" cy="39" rx="15" ry="18"/>

  <rect class="frame" x="80" y="0" width="64" height="78"/>
  <text class="z" x="81" y="92">z + 1</text>
  <ellipse class="f1" cx="112" cy="39" rx="9" ry="11"/>

  <rect class="frameBad" x="160" y="0" width="64" height="78"/>
  <text class="z" x="161" y="92" fill="#a07d1f">z + 2</text>
  <ellipse class="ghost" cx="192" cy="39" rx="4" ry="4"/>
  <text class="z" x="201" y="43" fill="#a07d1f">nothing detected</text>
  <text class="tagg" x="160" y="-8">process below resolution</text>

  <rect class="frame" x="240" y="0" width="64" height="78"/>
  <text class="z" x="241" y="92">z + 3</text>
  <ellipse class="f2" cx="272" cy="39" rx="9" ry="11"/>

  <rect class="frame" x="320" y="0" width="64" height="78"/>
  <text class="z" x="321" y="92">z + 4</text>
  <ellipse class="f2" cx="352" cy="39" rx="14" ry="17"/>

  <text class="tag"  x="416" y="26">Two fragments where there is one neuron.</text>
  <text class="sub"  x="416" y="46">The cell's connections are divided between</text>
  <text class="sub"  x="416" y="60">two objects, so both are undercounted and</text>
  <text class="sub"  x="416" y="74">the path through the circuit disappears.</text>
</g>

<line x1="0" y1="152" x2="760" y2="152" stroke="#e6e1d8" stroke-width="1"/>

<!-- ============ AFTER ============ -->
<text class="lbl" x="0" y="186">After correction</text>
<text class="sub" x="120" y="186">one object</text>

<g transform="translate(0,198)">
  <rect class="frame" x="0" y="0" width="64" height="78"/>
  <text class="z" x="1" y="92">z</text>
  <ellipse class="one" cx="32" cy="39" rx="15" ry="18"/>

  <rect class="frame" x="80" y="0" width="64" height="78"/>
  <text class="z" x="81" y="92">z + 1</text>
  <ellipse class="one" cx="112" cy="39" rx="9" ry="11"/>

  <rect class="frameBad" x="160" y="0" width="64" height="78"/>
  <text class="z" x="161" y="92" fill="#a07d1f">z + 2</text>
  <ellipse class="ghost" cx="192" cy="39" rx="4" ry="4"/>
  <path class="link" d="M 121 39 L 263 39"/>
  <text class="tagg" x="160" y="-8">bridged on continuity</text>

  <rect class="frame" x="240" y="0" width="64" height="78"/>
  <text class="z" x="241" y="92">z + 3</text>
  <ellipse class="one" cx="272" cy="39" rx="9" ry="11"/>

  <rect class="frame" x="320" y="0" width="64" height="78"/>
  <text class="z" x="321" y="92">z + 4</text>
  <ellipse class="one" cx="352" cy="39" rx="14" ry="17"/>

  <text class="tag"  x="416" y="26">One object, rejoined across the gap.</text>
  <text class="sub"  x="416" y="46">The fragments line up in position and taper</text>
  <text class="sub"  x="416" y="60">consistently, which is the evidence for the join.</text>
  <text class="sub"  x="416" y="74">Where it is not this clear, the object is flagged</text>
  <text class="sub"  x="416" y="88">rather than edited on a guess.</text>
</g>

<text class="note" x="0" y="374">Schematic. Cross-sections drawn for clarity, not electron microscopy imagery.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">A merge error before and after correction</title>
<desc id="d">Top row: the segmentation as the algorithm returned it, with two neurons fused into a single object where their membranes touch. Bottom row: the same four slices after the false join was cut, with the two cells assigned to separate objects.</desc>
<style>
  .lbl{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#1c1b19}
  .sub{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;fill:#6b6763}
  .z{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#8c877f}
  .tag{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:#1c1b19;font-weight:600}
  .tagg{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:#a07d1f;font-weight:700}
  .note{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .frame{fill:#fdfcfa;stroke:#d9d4cc;stroke-width:1}
  .frameBad{fill:#fdfcfa;stroke:#a07d1f;stroke-width:1.6}
  .a{fill:#e4dfd6;stroke:#1c1b19;stroke-width:1.4}
  .b{fill:#ffffff;stroke:#1c1b19;stroke-width:1.4}
  .m{fill:#f2e2bb;stroke:#a07d1f;stroke-width:1.6}
  .mfill{fill:#f2e2bb}
  .cut{stroke:#a07d1f;stroke-width:2}
</style>

<!-- ============ BEFORE ============ -->
<text class="lbl" x="0" y="14">As the algorithm returned it</text>
<text class="sub" x="176" y="14">one object</text>

<g transform="translate(0,26)">
  <!-- z -->
  <rect class="frame" x="0" y="0" width="78" height="78"/>
  <text class="z" x="1" y="92">z</text>
  <ellipse class="m" cx="28" cy="39" rx="15" ry="18"/>
  <ellipse class="m" cx="54" cy="39" rx="13" ry="16"/>
  <rect class="mfill" x="38" y="25" width="8" height="28"/>

  <!-- z+1 -->
  <rect class="frame" x="96" y="0" width="78" height="78"/>
  <text class="z" x="97" y="92">z + 1</text>
  <ellipse class="m" cx="124" cy="39" rx="15" ry="18"/>
  <ellipse class="m" cx="150" cy="39" rx="13" ry="16"/>
  <rect class="mfill" x="134" y="25" width="8" height="28"/>

  <!-- z+2 : where it happens -->
  <rect class="frameBad" x="192" y="0" width="78" height="78"/>
  <text class="z" x="193" y="92" fill="#a07d1f">z + 2</text>
  <ellipse class="m" cx="220" cy="39" rx="15" ry="18"/>
  <ellipse class="m" cx="246" cy="39" rx="13" ry="16"/>
  <rect class="mfill" x="230" y="25" width="8" height="28"/>
  <text class="tagg" x="192" y="-8">membrane faint here</text>

  <!-- z+3 -->
  <rect class="frame" x="288" y="0" width="78" height="78"/>
  <text class="z" x="289" y="92">z + 3</text>
  <ellipse class="m" cx="316" cy="39" rx="14" ry="17"/>
  <ellipse class="m" cx="342" cy="39" rx="13" ry="16"/>
  <rect class="mfill" x="326" y="25" width="8" height="28"/>

  <!-- outcome -->
  <text class="tag"  x="400" y="26">One object where there are two neurons.</text>
  <text class="sub"  x="400" y="46">Every synapse belonging to either cell is</text>
  <text class="sub"  x="400" y="60">credited to the same neuron, so the wiring</text>
  <text class="sub"  x="400" y="74">diagram gains connections that do not exist.</text>
</g>

<line x1="0" y1="152" x2="760" y2="152" stroke="#e6e1d8" stroke-width="1"/>

<!-- ============ AFTER ============ -->
<text class="lbl" x="0" y="186">After correction</text>
<text class="sub" x="120" y="186">two objects</text>

<g transform="translate(0,198)">
  <rect class="frame" x="0" y="0" width="78" height="78"/>
  <text class="z" x="1" y="92">z</text>
  <ellipse class="a" cx="28" cy="39" rx="15" ry="18"/>
  <ellipse class="b" cx="54" cy="39" rx="13" ry="16"/>

  <rect class="frame" x="96" y="0" width="78" height="78"/>
  <text class="z" x="97" y="92">z + 1</text>
  <ellipse class="a" cx="124" cy="39" rx="15" ry="18"/>
  <ellipse class="b" cx="150" cy="39" rx="13" ry="16"/>

  <rect class="frameBad" x="192" y="0" width="78" height="78"/>
  <text class="z" x="193" y="92" fill="#a07d1f">z + 2</text>
  <ellipse class="a" cx="220" cy="39" rx="15" ry="18"/>
  <ellipse class="b" cx="246" cy="39" rx="13" ry="16"/>
  <line class="cut" x1="233" y1="20" x2="233" y2="58"/>
  <text class="tagg" x="192" y="-8">boundary restored by hand</text>

  <rect class="frame" x="288" y="0" width="78" height="78"/>
  <text class="z" x="289" y="92">z + 3</text>
  <ellipse class="a" cx="316" cy="39" rx="14" ry="17"/>
  <ellipse class="b" cx="342" cy="39" rx="13" ry="16"/>

  <text class="tag"  x="400" y="26">Two objects, traced independently.</text>
  <text class="sub"  x="400" y="46">The decision is made by following each</text>
  <text class="sub"  x="400" y="60">cross-section through the neighbouring slices:</text>
  <text class="sub"  x="400" y="74">a real process moves and changes gradually.</text>
</g>

<text class="note" x="0" y="374">Schematic. Cross-sections drawn for clarity, not electron microscopy imagery.</text>
</svg>

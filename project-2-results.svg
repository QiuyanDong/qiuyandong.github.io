<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Carbon footprint by life-cycle stage and by material</title>
<desc id="d">Left: manufacturing contributes 7.10 g CO2-e per kWh, installation 0.40, operation 1.50, and end-of-life recycling returns a credit of 2.01, giving a lifetime net of 6.99 against the manufacturer's published 7.0. Right: steel and iron account for 55.3 percent of material emissions and glass and carbon fibre 29.1 percent.</desc>
<style>
  .h{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#1c1b19}
  .ax{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#8c877f}
  .cat{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#1c1b19}
  .val{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:700;fill:#1c1b19}
  .valg{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:700;fill:#a07d1f}
  .sm{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#6b6763}
  .cap{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .grid{stroke:#e6e1d8;stroke-width:1}
  .bar{fill:#d6d0c5}
  .cred{fill:#a07d1f;opacity:.55}
  .net{fill:#1c1b19}
  .ref{stroke:#a07d1f;stroke-width:1.2;stroke-dasharray:4 3}
  .conn{stroke:#c4bdb1;stroke-width:1}
</style>

<!-- ================= LEFT : stage waterfall ================= -->
<text class="h" x="0" y="14">By life-cycle stage</text>
<text class="sm" x="128" y="14">g CO₂-e / kWh</text>

<!-- y: 0 at 300, 24px per unit -->
<g>
  <line class="grid" x1="34" y1="300" x2="400" y2="300"/>
  <line class="grid" x1="34" y1="252" x2="400" y2="252"/>
  <line class="grid" x1="34" y1="204" x2="400" y2="204"/>
  <line class="grid" x1="34" y1="156" x2="400" y2="156"/>
  <line class="grid" x1="34" y1="108" x2="400" y2="108"/>
  <line class="grid" x1="34" y1="60"  x2="400" y2="60"/>
  <text class="ax" x="18" y="304">0</text>
  <text class="ax" x="18" y="256">2</text>
  <text class="ax" x="18" y="208">4</text>
  <text class="ax" x="18" y="160">6</text>
  <text class="ax" x="18" y="112">8</text>
  <text class="ax" x="14" y="64">10</text>
</g>

<!-- manufacture 0 -> 7.10 -->
<rect class="bar" x="46" y="129.6" width="52" height="170.4"/>
<text class="val" x="50" y="122">7.10</text>
<text class="cat" x="46" y="318">Manufacture</text>
<text class="sm"  x="46" y="331">79% of gross</text>

<!-- install 7.10 -> 7.50 -->
<rect class="bar" x="116" y="120" width="52" height="9.6"/>
<text class="val" x="120" y="112">0.40</text>
<text class="cat" x="116" y="318">Install</text>

<!-- operation 7.50 -> 9.00 -->
<rect class="bar" x="186" y="84" width="52" height="36"/>
<text class="val" x="190" y="76">1.50</text>
<text class="cat" x="186" y="318">Operate</text>

<!-- recycling credit 9.00 -> 6.99 -->
<rect class="cred" x="256" y="84" width="52" height="48.2"/>
<text class="valg" x="256" y="76">−2.01</text>
<text class="cat" x="256" y="318">Recycle</text>
<text class="sm"  x="256" y="331">−22% net</text>

<!-- net total -->
<rect class="net" x="332" y="132.2" width="52" height="167.8"/>
<text class="val" x="336" y="124">6.99</text>
<text class="cat" x="332" y="318">Lifetime</text>
<text class="sm"  x="332" y="331">net</text>

<!-- connectors -->
<path class="conn" d="M 98 129.6 L 116 129.6"/>
<path class="conn" d="M 168 120 L 186 120"/>
<path class="conn" d="M 238 84 L 256 84"/>
<path class="conn" d="M 308 132.2 L 332 132.2"/>

<!-- published reference -->
<line class="ref" x1="34" y1="132" x2="400" y2="132"/>
<text class="valg" x="34" y="345">Manufacturer's published figure: 7.0 — a gap under 0.2%</text>

<!-- ================= RIGHT : material contribution ================= -->
<text class="h" x="452" y="14">By material</text>
<text class="sm" x="540" y="14">share of material emissions</text>

<!-- scale: 3.55 px per % , bars start x=560 -->
<g>
  <!-- steel -->
  <text class="cat" x="452" y="52">Steel and iron</text>
  <rect class="net" x="560" y="42" width="196" height="13"/>
  <text class="val" x="560" y="36">55.3%</text>

  <!-- fibre -->
  <text class="cat" x="452" y="84">Glass / carbon fibre</text>
  <rect class="net" x="560" y="74" width="103" height="13"/>
  <text class="val" x="560" y="68">29.1%</text>

  <!-- copper -->
  <text class="cat" x="452" y="116">Copper</text>
  <rect class="bar" x="560" y="106" width="17" height="13"/>
  <text class="sm" x="583" y="117">4.8%</text>

  <!-- polymer -->
  <text class="cat" x="452" y="140">Polymers</text>
  <rect class="bar" x="560" y="130" width="15" height="13"/>
  <text class="sm" x="581" y="141">4.3%</text>

  <!-- electronics -->
  <text class="cat" x="452" y="164">Electronics</text>
  <rect class="bar" x="560" y="154" width="11" height="13"/>
  <text class="sm" x="577" y="165">3.1%</text>

  <!-- aluminium -->
  <text class="cat" x="452" y="188">Aluminium</text>
  <rect class="bar" x="560" y="178" width="10" height="13"/>
  <text class="sm" x="576" y="189">2.8%</text>

  <!-- remainder -->
  <text class="cat" x="452" y="212">Magnet, concrete, oil</text>
  <rect class="bar" x="560" y="202" width="2" height="13"/>
  <text class="sm" x="568" y="213">0.2% each</text>
</g>

<!-- bracket over top two -->
<path d="M 762 42 L 768 42 L 768 87 L 762 87" fill="none" stroke="#a07d1f" stroke-width="1.2" transform="translate(-8,0)"/>
<text class="valg" x="452" y="248">The top two materials are 84% of the total —</text>
<text class="sm"   x="452" y="263">which is why the abatement measures the system</text>
<text class="sm"   x="452" y="277">ranks highest are green steel for the tower and</text>
<text class="sm"   x="452" y="291">recyclable resin for the blades, not operational</text>
<text class="sm"   x="452" y="305">efficiency.</text>

<text class="cap" x="0" y="378">Output of one run on the demonstration bill of materials. Every figure here is computed by the workflow, not entered by hand.</text>
<text class="cap" x="0" y="396">Emission factors were calibrated against the published result, so this validates the accounting structure — it is not an independent inventory.</text>
</svg>

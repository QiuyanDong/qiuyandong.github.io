<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The 14-node carbon footprint agent workflow</title>
<desc id="d">Workflow with 14 nodes and 15 edges. Code nodes perform calculation and rendering; language model nodes handle extraction, prose, and relaying data between adjacent code nodes. Nodes 4 and 6 also feed into node 9.</desc>
<style>
  .h{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:600;fill:#1c1b19}
  .n{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11.5px;fill:#1c1b19}
  .num{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;font-weight:700;fill:#8c877f}
  .k{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#6b6763}
  .cap{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .code{fill:#f0ede7;stroke:#1c1b19;stroke-width:1.3}
  .llm{fill:#ffffff;stroke:#6b6763;stroke-width:1.1;stroke-dasharray:3 2.5}
  .flow{fill:#1c1b19}
  .flowtxt{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11.5px;fill:#ffffff;font-weight:600}
  .e{fill:none;stroke:#b3ada2;stroke-width:1.1}
  .e2{fill:none;stroke:#a07d1f;stroke-width:1.3}
</style>

<!-- legend -->
<text class="h" x="0" y="14">14 nodes · 15 edges</text>
<g transform="translate(180,4)">
  <rect class="flow" x="0" y="0" width="14" height="11" rx="5.5"/><text class="k" x="20" y="9">flow</text>
  <rect class="code" x="58" y="0" width="14" height="11" rx="2"/><text class="k" x="78" y="9">code — calculation, rendering</text>
  <rect class="llm" x="232" y="0" width="14" height="11" rx="5"/><text class="k" x="252" y="9">language model — extraction, prose, relay</text>
</g>

<!-- ================= LEFT COLUMN ================= -->
<g transform="translate(0,40)">
  <!-- start -->
  <rect class="flow" x="20" y="0" width="240" height="30" rx="15"/>
  <text class="flowtxt" x="36" y="20">Start — bill of materials as text</text>

  <!-- 1 -->
  <rect class="llm" x="20" y="52" width="240" height="30" rx="8"/>
  <text class="num" x="30" y="71">1</text><text class="n" x="46" y="71">Extract LCA scope and parameters</text>

  <!-- 2 -->
  <rect class="llm" x="20" y="104" width="240" height="30" rx="8"/>
  <text class="num" x="30" y="123">2</text><text class="n" x="46" y="123">Extract material masses from BOM</text>

  <!-- 3 -->
  <rect class="code" x="20" y="156" width="240" height="30" rx="3"/>
  <text class="num" x="30" y="175">3</text><text class="n" x="46" y="175">mass × factor ÷ lifetime output</text>

  <!-- 4 -->
  <rect class="llm" x="20" y="208" width="240" height="30" rx="8"/>
  <text class="num" x="30" y="227">4</text><text class="n" x="46" y="227">Relay — reserialise, change no number</text>

  <!-- 5 -->
  <rect class="code" x="20" y="260" width="240" height="30" rx="3"/>
  <text class="num" x="30" y="279">5</text><text class="n" x="46" y="279">Rank materials, find dominant stage</text>

  <!-- 6 -->
  <rect class="llm" x="20" y="312" width="240" height="30" rx="8"/>
  <text class="num" x="30" y="331">6</text><text class="n" x="46" y="331">Relay — reserialise, change no number</text>

  <!-- 7 -->
  <rect class="code" x="20" y="364" width="240" height="30" rx="3"/>
  <text class="num" x="30" y="383">7</text><text class="n" x="46" y="383">Look up abatement measures, prioritise</text>

  <!-- vertical edges left -->
  <path class="e" d="M 140 30 L 140 52"/>
  <path class="e" d="M 140 82 L 140 104"/>
  <path class="e" d="M 140 134 L 140 156"/>
  <path class="e" d="M 140 186 L 140 208"/>
  <path class="e" d="M 140 238 L 140 260"/>
  <path class="e" d="M 140 290 L 140 312"/>
  <path class="e" d="M 140 342 L 140 364"/>
</g>

<!-- ================= RIGHT COLUMN ================= -->
<g transform="translate(0,40)">
  <!-- 8 -->
  <rect class="llm" x="500" y="52" width="240" height="30" rx="8"/>
  <text class="num" x="510" y="71">8</text><text class="n" x="528" y="71">Rewrite advice as report prose</text>

  <!-- 9 -->
  <rect class="code" x="500" y="130" width="240" height="30" rx="3"/>
  <text class="num" x="510" y="149">9</text><text class="n" x="528" y="149">Merge results, ranking, advice</text>

  <!-- 10 -->
  <rect class="llm" x="500" y="208" width="240" height="30" rx="8"/>
  <text class="num" x="506" y="227">10</text><text class="n" x="528" y="227">Serialise to four fixed fields</text>

  <!-- 11 -->
  <rect class="code" x="500" y="286" width="240" height="30" rx="3"/>
  <text class="num" x="506" y="305">11</text><text class="n" x="528" y="305">Render HTML report template</text>

  <!-- 12 -->
  <rect class="llm" x="500" y="364" width="240" height="30" rx="8"/>
  <text class="num" x="506" y="383">12</text><text class="n" x="528" y="383">Strip to clean HTML source</text>

  <!-- end -->
  <rect class="flow" x="500" y="434" width="240" height="30" rx="15"/>
  <text class="flowtxt" x="516" y="454">End — HTML source out</text>

  <path class="e" d="M 620 82 L 620 130"/>
  <path class="e" d="M 620 160 L 620 208"/>
  <path class="e" d="M 620 238 L 620 286"/>
  <path class="e" d="M 620 316 L 620 364"/>
  <path class="e" d="M 620 394 L 620 434"/>
</g>

<!-- 7 -> 8 : column hand-off -->
<path class="e" d="M 260 447 C 330 447 330 132 500 132" transform="translate(0,-40)"/>
<path class="e" d="M 494 87 L 500 92 L 494 97"/>

<!-- converging edges 4 -> 9 and 6 -> 9 (the notable structure) -->
<path class="e2" d="M 260 288 C 380 288 400 210 500 210"/>
<path class="e2" d="M 260 392 C 380 392 400 216 500 216"/>
<path class="e2" d="M 494 205 L 500 210 L 494 215"/>
<text class="cap" x="300" y="256">nodes 4 and 6 also feed node 9 —</text>
<text class="cap" x="300" y="270">the 2 edges that make 15, not 13</text>

<text class="cap" x="0" y="512">Code nodes cannot pass data to each other on this platform, which is why a language model sits between every pair of them.</text>
</svg>

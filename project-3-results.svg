<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Confusion matrix for the improved sex classifier</title>
<desc id="d">Of 170 held-out lizards the Random Forest classifier placed 151 correctly and 19 incorrectly. Male recall is 83.5 percent and female recall 94.1 percent, so overall accuracy of 88.82 percent conceals a ten-point gap between the two classes.</desc>
<style>
  .h{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#1c1b19}
  .ax{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:#6b6763}
  .axb{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-weight:600}
  .big{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:22px;font-weight:700;fill:#1c1b19}
  .bigw{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:22px;font-weight:700;fill:#a07d1f}
  .sm{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#6b6763}
  .met{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;fill:#1c1b19}
  .metv{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;font-weight:700;fill:#1c1b19}
  .metg{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;font-weight:700;fill:#a07d1f}
  .cap{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .hit{fill:#1c1b19}
  .hit2{fill:#3a3833}
  .miss{fill:#f2e2bb;stroke:#a07d1f;stroke-width:1.2}
  .cellw{fill:#ffffff}
  .rule{stroke:#e6e1d8;stroke-width:1}
</style>

<text class="h" x="0" y="14">Sex classifier, held-out predictions</text>
<text class="sm" x="232" y="14">Random Forest, 170 animals</text>

<!-- axis labels -->
<text class="axb" x="120" y="44">PREDICTED</text>
<text class="ax"  x="146" y="64">male</text>
<text class="ax"  x="250" y="64">female</text>
<text class="axb" x="4" y="112" transform="rotate(-90 20 130)">TRUE</text>

<!-- row 1 : true male -->
<text class="ax" x="56" y="118">male</text>
<rect class="hit"  x="120" y="74" width="90" height="80"/>
<text class="big"  x="152" y="122" fill="#ffffff">71</text>
<rect class="miss" x="218" y="74" width="90" height="80"/>
<text class="bigw" x="250" y="122">14</text>

<!-- row 2 : true female -->
<text class="ax" x="46" y="206">female</text>
<rect class="miss" x="120" y="162" width="90" height="80"/>
<text class="bigw" x="156" y="210">5</text>
<rect class="hit2" x="218" y="162" width="90" height="80"/>
<text class="big"  x="250" y="210" fill="#ffffff">80</text>

<text class="sm" x="120" y="262">Dark cells are correct calls. 151 right, 19 wrong.</text>

<!-- ============ right panel : what the numbers mean ============ -->
<line class="rule" x1="360" y1="40" x2="360" y2="250"/>

<g transform="translate(400,0)">
  <text class="met"  x="0" y="60">Overall accuracy</text>
  <text class="metv" x="0" y="82">88.82%</text>
  <text class="sm"   x="0" y="98">the figure usually quoted</text>

  <text class="met"  x="0" y="140">Recall, male</text>
  <text class="metg" x="0" y="162">83.5%</text>
  <text class="sm"   x="0" y="178">14 of 85 males called female</text>

  <text class="met"  x="190" y="140">Recall, female</text>
  <text class="metv" x="190" y="162">94.1%</text>
  <text class="sm"   x="190" y="178">5 of 85 females called male</text>

  <path d="M 0 200 L 300 200" stroke="#a07d1f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="met" x="0" y="222">The two classes are not equally hard. A single</text>
  <text class="met" x="0" y="238">accuracy number hides a ten-point gap.</text>
</g>

<text class="cap" x="0" y="320">This is the one task where the classes are balanced 85 / 85. On the species tasks, where some classes have a handful of</text>
<text class="cap" x="0" y="334">members, overall accuracy is considerably more misleading than it is here.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Accuracy by task: SVM baseline against targeted alternatives</title>
<desc id="d">Eight-fold cross-validated accuracy for each classification task. The SVM baseline is shown against AdaBoost, Random Forest, or the improved cascade where an alternative was built.</desc>
<style>
  .h{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:600;fill:#1c1b19}
  .ax{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f}
  .tk{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;fill:#1c1b19}
  .tk2{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#8c877f}
  .val{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#1c1b19;font-weight:600}
  .valg{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#a07d1f;font-weight:700}
  .k{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#6b6763}
  .cap{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .grid{stroke:#e6e1d8;stroke-width:1}
  .base{fill:#d6d0c5}
  .imp{fill:#a07d1f}
  .gain{fill:none;stroke:#a07d1f;stroke-width:1}
</style>

<text class="h" x="0" y="14">Accuracy by task, 8-fold cross-validated</text>
<g transform="translate(330,4)">
  <rect class="base" x="0" y="1" width="12" height="10"/><text class="k" x="18" y="10">SVM baseline</text>
  <rect class="imp" x="110" y="1" width="12" height="10"/><text class="k" x="128" y="10">targeted alternative</text>
</g>

<!-- ==== axes: y from 70 to 100 over 250px, baseline y=330 ==== -->
<!-- y(p) = 330 - (p-70)*8.3333 -->
<g>
  <line class="grid" x1="42" y1="330" x2="740" y2="330"/>
  <line class="grid" x1="42" y1="247" x2="740" y2="247"/>
  <line class="grid" x1="42" y1="163" x2="740" y2="163"/>
  <line class="grid" x1="42" y1="80"  x2="740" y2="80"/>
  <text class="ax" x="14" y="334">70%</text>
  <text class="ax" x="14" y="251">80%</text>
  <text class="ax" x="14" y="167">90%</text>
  <text class="ax" x="8"  y="84">100%</text>
</g>

<!-- Task 1 : 99.82 only -->
<g>
  <rect class="base" x="60" y="81.5" width="34" height="248.5"/>
  <text class="val" x="62" y="74">99.82</text>
  <text class="tk"  x="60" y="350">Task 1</text>
  <text class="tk2" x="60" y="364">species 5,</text>
  <text class="tk2" x="60" y="376">one variable</text>
</g>

<!-- Task 2 : 95.74 -> 99.82 (AdaBoost) -->
<g>
  <rect class="base" x="158" y="115.5" width="34" height="214.5"/>
  <rect class="imp"  x="196" y="81.5"  width="34" height="248.5"/>
  <text class="val"  x="158" y="108">95.74</text>
  <text class="valg" x="198" y="74">99.82</text>
  <text class="tk"  x="158" y="350">Task 2</text>
  <text class="tk2" x="158" y="364">best variable pair</text>
  <text class="tk2" x="158" y="376">AdaBoost</text>
</g>

<!-- Task 3 : 81.43 -> 88.82 (Random Forest) -->
<g>
  <rect class="base" x="268" y="235.6" width="34" height="94.4"/>
  <rect class="imp"  x="306" y="173.2" width="34" height="156.8"/>
  <text class="val"  x="268" y="228">81.43</text>
  <text class="valg" x="308" y="166">88.82</text>
  <text class="tk"  x="268" y="350">Task 3</text>
  <text class="tk2" x="268" y="364">sex</text>
  <text class="tk2" x="268" y="376">Random Forest</text>
</g>

<!-- Task 4a 84.56 -->
<g>
  <rect class="base" x="378" y="208.7" width="34" height="121.3"/>
  <text class="val" x="378" y="201">84.56</text>
  <text class="tk"  x="378" y="350">Task 4a</text>
  <text class="tk2" x="378" y="364">species 6 vs 7</text>
</g>

<!-- Task 4b 84.42 -->
<g>
  <rect class="base" x="454" y="209.8" width="34" height="120.2"/>
  <text class="val" x="454" y="202">84.42</text>
  <text class="tk"  x="454" y="350">Task 4b</text>
  <text class="tk2" x="454" y="364">species 1 vs 2</text>
</g>

<!-- Task 4c 89.00 -->
<g>
  <rect class="base" x="530" y="171.7" width="34" height="158.3"/>
  <text class="val" x="530" y="164">89.00</text>
  <text class="tk"  x="530" y="350">Task 4c</text>
  <text class="tk2" x="530" y="364">species 3, 4, 5</text>
</g>

<!-- Task 5 : 72.97 -> 79.47 -->
<g>
  <rect class="base" x="640" y="305.3" width="34" height="24.7"/>
  <rect class="imp"  x="678" y="251.1" width="34" height="78.9"/>
  <text class="val"  x="640" y="298">72.97</text>
  <text class="valg" x="680" y="244">79.47</text>
  <text class="tk"  x="640" y="350">Task 5</text>
  <text class="tk2" x="640" y="364">species + sex,</text>
  <text class="tk2" x="640" y="376">full population</text>
</g>

<text class="cap" x="0" y="404">Overall accuracy on imbalanced classes flatters every bar here; per-class recall would be the honest measure. See the write-up.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">When each model expects the temperature thresholds to be crossed</title>
<desc id="d">Quadratic regression and ARIMA agree closely on all three thresholds: 1.25 degrees around 2030 to 2031, 1.5 degrees in 2038, and 2 degrees in 2052. Linear regression is consistently later, and the neural network reaches only the first threshold before its projection flattens.</desc>
<style>
  .h{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#1c1b19}
  .ax{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#8c877f}
  .row{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:700;fill:#1c1b19}
  .k{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#6b6763}
  .yr{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#1c1b19;font-weight:600}
  .yrg{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#a07d1f;font-weight:700}
  .sm{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#6b6763}
  .cap{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .grid{stroke:#e6e1d8;stroke-width:1}
  .lane{stroke:#d9d4cc;stroke-width:1}
  .arima{fill:#1c1b19}
  .quad{fill:#a07d1f}
  .lin{fill:#ffffff;stroke:#1c1b19;stroke-width:1.4}
  .bp{fill:#d6d0c5;stroke:#8c877f;stroke-width:1}
  .agree{fill:none;stroke:#a07d1f;stroke-width:1}
</style>

<text class="h" x="0" y="14">Year each threshold is crossed, above the 1951–1980 mean</text>

<!-- legend -->
<g transform="translate(0,30)">
  <circle class="arima" cx="6" cy="6" r="5"/><text class="k" x="18" y="10">ARIMA</text>
  <circle class="quad" cx="88" cy="6" r="5"/><text class="k" x="100" y="10">quadratic regression</text>
  <circle class="lin" cx="228" cy="6" r="5"/><text class="k" x="240" y="10">linear regression</text>
  <rect class="bp" x="352" y="1" width="10" height="10"/><text class="k" x="370" y="10">neural network</text>
</g>

<!-- x axis: 2025 -> 2100, x = 110 + (yr-2025)*8 -->
<g>
  <line class="grid" x1="150" y1="70" x2="150" y2="300"/>
  <line class="grid" x1="310" y1="70" x2="310" y2="300"/>
  <line class="grid" x1="470" y1="70" x2="470" y2="300"/>
  <line class="grid" x1="630" y1="70" x2="630" y2="300"/>
  <text class="ax" x="138" y="316">2030</text>
  <text class="ax" x="298" y="316">2050</text>
  <text class="ax" x="458" y="316">2070</text>
  <text class="ax" x="618" y="316">2090</text>
</g>

<!-- ===== row 1 : 1.25 C ===== -->
<text class="row" x="0" y="104">1.25 °C</text>
<line class="lane" x1="110" y1="100" x2="730" y2="100"/>
<circle class="arima" cx="150" cy="100" r="5.5"/>
<circle class="quad"  cx="158" cy="100" r="5.5"/>
<circle class="lin"   cx="262" cy="100" r="5.5"/>
<rect   class="bp"    x="449" y="94" width="11" height="11"/>
<text class="yr" x="136" y="86">2030 / 2031</text>
<text class="yr" x="250" y="86">2044</text>
<text class="yr" x="444" y="86">2068</text>

<!-- ===== row 2 : 1.50 C ===== -->
<text class="row" x="0" y="179">1.50 °C</text>
<line class="lane" x1="110" y1="175" x2="730" y2="175"/>
<circle class="arima" cx="214" cy="175" r="5.5"/>
<circle class="quad"  cx="214" cy="175" r="2.2" fill="#f2e2bb"/>
<circle class="lin"   cx="390" cy="175" r="5.5"/>
<text class="yr" x="202" y="161">2038</text>
<text class="yr" x="378" y="161">2060</text>
<text class="sm" x="470" y="179">neural network never reaches it</text>

<!-- ===== row 3 : 2.00 C ===== -->
<text class="row" x="0" y="254">2.00 °C</text>
<line class="lane" x1="110" y1="250" x2="730" y2="250"/>
<circle class="arima" cx="326" cy="250" r="5.5"/>
<circle class="quad"  cx="326" cy="250" r="2.2" fill="#f2e2bb"/>
<circle class="lin"   cx="630" cy="250" r="5.5"/>
<text class="yr" x="314" y="236">2052</text>
<text class="yr" x="618" y="236">2090</text>
<text class="sm" x="470" y="270">neural network never reaches it</text>

<!-- agreement bracket -->
<path class="agree" d="M 206 190 L 206 244 M 206 190 L 214 190 M 206 244 L 214 244"/>
<text class="yrg" x="230" y="206">ARIMA and quadratic regression land on the</text>
<text class="yrg" x="230" y="220">same year for both upper thresholds —</text>
<text class="sm"  x="230" y="234">two methods, different assumptions, one answer.</text>

<text class="cap" x="0" y="348">The neural network has the highest fit to the observed record (R² = 0.948) and the least usable projection: its long-range</text>
<text class="cap" x="0" y="362">temperature curve flattens, so it never crosses the thresholds the other three models cross. Fit and forecast are not the same thing.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">CO2 concentration: observed record and ARIMA projection</title>
<desc id="d">Observed CO2 concentration from 1959 to 2021 and the ARIMA(3,2,2) projection to 2100, reaching 497.97 ppm in 2050 and 770.57 ppm in 2100. Beyond roughly 2040 and 470 ppm the correlation model diverges from the independent forecasts and is not treated as reliable.</desc>
<style>
  .h{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:600;fill:#1c1b19}
  .ax{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f}
  .k{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#6b6763}
  .an{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;fill:#1c1b19;font-weight:600}
  .ang{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;fill:#a07d1f;font-weight:700}
  .sm{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#6b6763}
  .cap{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .grid{stroke:#e6e1d8;stroke-width:1}
  .obs{fill:none;stroke:#1c1b19;stroke-width:2}
  .proj{fill:none;stroke:#1c1b19;stroke-width:1.6;stroke-dasharray:5 4}
  .band{fill:#a07d1f;opacity:.07}
  .bound{stroke:#a07d1f;stroke-width:1.2;stroke-dasharray:3 3}
  .dot{fill:#1c1b19}
  .dotg{fill:#a07d1f}
</style>

<text class="h" x="0" y="14">Atmospheric CO₂: observed 1959–2021, ARIMA(3,2,2) projected to 2100</text>

<!-- legend -->
<g transform="translate(0,26)">
  <line class="obs" x1="0" y1="6" x2="26" y2="6"/><text class="k" x="32" y="10">observed</text>
  <line class="proj" x1="100" y1="6" x2="126" y2="6"/><text class="k" x="132" y="10">projected</text>
  <rect class="band" x="204" y="0" width="26" height="12"/><text class="k" x="236" y="10">beyond the model's validated range</text>
</g>

<!-- unreliable region: x > 447 (year 2040) -->
<rect class="band" x="447" y="60" width="273" height="340"/>

<!-- gridlines: y(p) = 400 - (p-300)*0.68 -->
<g>
  <line class="grid" x1="90" y1="400" x2="720" y2="400"/>
  <line class="grid" x1="90" y1="332" x2="720" y2="332"/>
  <line class="grid" x1="90" y1="264" x2="720" y2="264"/>
  <line class="grid" x1="90" y1="196" x2="720" y2="196"/>
  <line class="grid" x1="90" y1="128" x2="720" y2="128"/>
  <line class="grid" x1="90" y1="60"  x2="720" y2="60"/>
  <text class="ax" x="56" y="404">300</text>
  <text class="ax" x="56" y="336">400</text>
  <text class="ax" x="56" y="268">500</text>
  <text class="ax" x="56" y="200">600</text>
  <text class="ax" x="56" y="132">700</text>
  <text class="ax" x="56" y="64">800</text>
  <text class="ax" x="56" y="46">ppm</text>
</g>

<!-- x ticks: x(y) = 90 + (year-1955)*4.2 -->
<g>
  <text class="ax" x="94"  y="418">1960</text>
  <text class="ax" x="178" y="418">1980</text>
  <text class="ax" x="262" y="418">2000</text>
  <text class="ax" x="346" y="418">2020</text>
  <text class="ax" x="430" y="418">2040</text>
  <text class="ax" x="514" y="418">2060</text>
  <text class="ax" x="598" y="418">2080</text>
  <text class="ax" x="682" y="418">2100</text>
</g>

<!-- observed curve, anchored on the cited record -->
<path class="obs" d="M 106.8 389.1 L 132 386.4 L 169.8 379.6 L 211.8 369.4 L 253.8 359.9 L 295.8 347.2 L 367.2 320.8"/>

<!-- projection -->
<path class="proj" d="M 367.2 320.8 C 395 311 420 297 447 284.4 C 465 274 478 270 489 265.4 C 531 243.6 553 228 573 209.6 C 600 185 625 155 657 128 C 672 112 688 94 699 80"/>

<!-- reliability boundary -->
<line class="bound" x1="447" y1="60" x2="447" y2="400"/>
<circle class="dotg" cx="447" cy="284.4" r="3.5"/>
<text class="ang" x="456" y="300">≈ 470 ppm, ≈ 2040</text>
<text class="sm"  x="456" y="314">correlation model holds to here;</text>
<text class="sm"  x="456" y="327">≈ 20% error by 650 ppm</text>

<!-- key projected points -->
<circle class="dot" cx="489" cy="265.4" r="3.5"/>
<text class="an" x="497" y="252">497.97 in 2050</text>

<circle class="dot" cx="699" cy="80" r="3.5"/>
<text class="an" x="614" y="72">770.57 in 2100</text>

<!-- observed end marker -->
<circle class="dot" cx="367.2" cy="320.8" r="3.5"/>
<text class="sm" x="300" y="312">416 ppm, 2021</text>

<text class="cap" x="0" y="444">R² = 0.999 describes the fit to the observed record on the left. It says nothing about the dashed line on the right —</text>
<text class="cap" x="0" y="458">which is the reason the reliability boundary is drawn at all.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The top two plans are a near-tie, and which parameters change the answer</title>
<desc id="d">The best plan scores 2,833,942 and the runner-up 2,827,930, a gap of 0.2 percent. Under a plus or minus five percent perturbation the layout is stable against most parameters but changes outright when the economic parameters move.</desc>
<style>
  .h{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#1c1b19}
  .n{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;fill:#1c1b19}
  .sc{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:16px;font-weight:700;fill:#1c1b19}
  .sm{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#6b6763}
  .lbl{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;font-weight:600;fill:#1c1b19}
  .g{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:700;fill:#a07d1f}
  .cap{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .bar{fill:#1c1b19}
  .bar2{fill:#d6d0c5}
  .stable{fill:#f0ede7;stroke:#b3ada2;stroke-width:1}
  .flips{fill:#f2e2bb;stroke:#a07d1f;stroke-width:1.3}
  .rule{stroke:#e6e1d8;stroke-width:1}
  .br{fill:none;stroke:#a07d1f;stroke-width:1.2}
</style>

<!-- ============ LEFT : the near tie ============ -->
<text class="h" x="0" y="14">Fitness of the top two plans</text>

<!-- bars: scale so 2,833,942 = 300px; zero suppressed and said so -->
<text class="lbl" x="0" y="52">Best plan</text>
<rect class="bar" x="0" y="58" width="300" height="26"/>
<text class="sc" x="0" y="106">2,833,942</text>
<text class="sm" x="0" y="120">solar array, agrivoltaic farm, grazing farm,</text>
<text class="sm" x="0" y="133">skiing facility, agritourism centre</text>

<text class="lbl" x="0" y="172">Runner-up</text>
<rect class="bar2" x="0" y="178" width="299.4" height="26"/>
<text class="sc" x="0" y="226">2,827,930</text>
<text class="sm" x="0" y="240">same building types, split across</text>
<text class="sm" x="0" y="253">non-adjacent zones</text>

<!-- gap bracket -->
<path class="br" d="M 316 58 L 322 58 L 322 204 L 316 204"/>
<text class="g"  x="332" y="122">0.2% apart</text>
<text class="sm" x="332" y="138">The model cannot really</text>
<text class="sm" x="332" y="151">separate them. The winner</text>
<text class="sm" x="332" y="164">was chosen on a criterion</text>
<text class="sm" x="332" y="177">outside the model: the</text>
<text class="sm" x="332" y="190">runner-up is impractical</text>
<text class="sm" x="332" y="203">to actually build.</text>

<text class="sm" x="0" y="276">Bars share a suppressed baseline — the visible difference is the whole difference.</text>

<line class="rule" x1="0" y1="296" x2="760" y2="296"/>

<!-- ============ RIGHT : sensitivity ============ -->
<g transform="translate(470,0)">
  <text class="h" x="0" y="14">Perturb every parameter by ±5%</text>

  <rect class="stable" x="0" y="30" width="270" height="76"/>
  <text class="lbl" x="10" y="48">Layout holds</text>
  <text class="sm"  x="10" y="64">construction cost, soil, water, biodiversity,</text>
  <text class="sm"  x="10" y="77">air quality, employment, volunteering,</text>
  <text class="sm"  x="10" y="90">discount rate</text>
  <text class="sm"  x="10" y="101">— most of the 1,120 parameters</text>

  <rect class="flips" x="0" y="118" width="270" height="90"/>
  <text class="lbl" x="10" y="136">Recommendation changes outright</text>
  <text class="sm"  x="10" y="152">unit labour cost</text>
  <text class="sm"  x="10" y="165">unit hardware maintenance</text>
  <text class="sm"  x="10" y="178">short-term unit benefit</text>
  <text class="sm"  x="10" y="191">long-term unit benefit</text>
  <text class="sm"  x="10" y="204">marketing cost</text>

  <text class="g"  x="0" y="230">Every one of these is economic —</text>
  <text class="sm" x="0" y="245">and they are the figures we compiled</text>
  <text class="sm" x="0" y="258">ourselves and can defend least.</text>
</g>

<text class="cap" x="0" y="322">The genetic algorithm itself was robust to mutation and crossover rate and sensitive to initial population size, so the search</text>
<text class="cap" x="0" y="336">quality is bounded by available compute rather than by tuning.</text>
<text class="cap" x="0" y="358">Both findings point the same way: this pipeline is a structure for making the trade-off explicit, not a machine that settles it.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The three-stage land use planning pipeline</title>
<desc id="d">Stage one scores the parcel on six indicators, renders each as a heat map, thresholds and cleans them, and overlays them to cut the land into ten zones. Stage two scores any zoning plan on economic, environmental and community value with weights from pairwise comparison. Stage three searches the zoning combinations with a genetic algorithm using that score as fitness.</desc>
<style>
  .st{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:700;fill:#a07d1f}
  .h{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#1c1b19}
  .n{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:#1c1b19}
  .sm{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#6b6763}
  .z{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:700;fill:#1c1b19}
  .za{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:8.5px;fill:#8c877f}
  .cap{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .box{fill:#fdfcfa;stroke:#1c1b19;stroke-width:1.2}
  .soft{fill:#f0ede7;stroke:#b3ada2;stroke-width:1}
  .zone{fill:#f0ede7;stroke:#1c1b19;stroke-width:1}
  .acc{fill:#f2e2bb;stroke:#a07d1f;stroke-width:1.3}
  .e{fill:none;stroke:#b3ada2;stroke-width:1.1}
  .rule{stroke:#e6e1d8;stroke-width:1}
</style>

<!-- ================= STAGE 1 ================= -->
<text class="st" x="0" y="12">STAGE 1</text>
<text class="h"  x="66" y="12">Cut the land into zones</text>
<text class="sm" x="238" y="12">computer vision</text>

<g transform="translate(0,24)">
  <!-- indicators -->
  <rect class="soft" x="0" y="0" width="104" height="94"/>
  <text class="sm" x="8" y="16">transport access</text>
  <text class="sm" x="8" y="30">slope angle</text>
  <text class="sm" x="8" y="44">signal coverage</text>
  <text class="sm" x="8" y="58">soil fertility</text>
  <text class="sm" x="8" y="72">water supply</text>
  <text class="sm" x="8" y="86">vegetation cover</text>
  <text class="n" x="0" y="110">six indicators, scored</text>

  <path class="e" d="M 104 47 L 138 47"/><path class="e" d="M 132 43 L 138 47 L 132 51"/>

  <rect class="box" x="138" y="18" width="84" height="58"/>
  <text class="n" x="150" y="42">heat map</text>
  <text class="sm" x="150" y="58">per indicator</text>

  <path class="e" d="M 222 47 L 256 47"/><path class="e" d="M 250 43 L 256 47 L 250 51"/>

  <rect class="box" x="256" y="18" width="96" height="58"/>
  <text class="n" x="266" y="40">threshold,</text>
  <text class="n" x="266" y="56">dilate, erode</text>
  <text class="sm" x="266" y="70">removes speckle</text>

  <path class="e" d="M 352 47 L 386 47"/><path class="e" d="M 380 43 L 386 47 L 380 51"/>

  <rect class="box" x="386" y="18" width="72" height="58"/>
  <text class="n" x="396" y="42">overlay</text>
  <text class="sm" x="396" y="58">all six</text>

  <path class="e" d="M 458 47 L 492 47"/><path class="e" d="M 486 43 L 492 47 L 486 51"/>

  <!-- ten zones -->
  <g transform="translate(496,10)">
    <rect class="zone" x="0"  y="0"  width="48" height="30"/><text class="z" x="6" y="15">A</text><text class="za" x="18" y="15">0.84</text>
    <rect class="zone" x="52" y="0"  width="48" height="30"/><text class="z" x="58" y="15">B</text><text class="za" x="70" y="15">0.21</text>
    <rect class="zone" x="104" y="0" width="48" height="30"/><text class="z" x="110" y="15">C</text><text class="za" x="122" y="15">0.66</text>
    <rect class="zone" x="156" y="0" width="48" height="30"/><text class="z" x="162" y="15">D</text><text class="za" x="174" y="15">0.30</text>
    <rect class="zone" x="0"  y="34" width="48" height="30"/><text class="z" x="6" y="49">E</text><text class="za" x="18" y="49">0.61</text>
    <rect class="zone" x="52" y="34" width="48" height="30"/><text class="z" x="58" y="49">F</text><text class="za" x="70" y="49">0.55</text>
    <rect class="zone" x="104" y="34" width="48" height="30"/><text class="z" x="110" y="49">G</text><text class="za" x="122" y="49">0.38</text>
    <rect class="zone" x="156" y="34" width="48" height="30"/><text class="z" x="162" y="49">H</text><text class="za" x="174" y="49">0.36</text>
    <rect class="zone" x="0"  y="68" width="48" height="30"/><text class="z" x="6" y="83">I</text><text class="za" x="18" y="83">0.47</text>
    <rect class="zone" x="52" y="68" width="48" height="30"/><text class="z" x="58" y="83">J</text><text class="za" x="70" y="83">0.62</text>
    <text class="sm" x="106" y="83">km² each</text>
  </g>
  <text class="n" x="496" y="124">ten zones, each with its own profile</text>
</g>

<line class="rule" x1="0" y1="172" x2="760" y2="172"/>

<!-- ================= STAGE 2 ================= -->
<text class="st" x="0" y="198">STAGE 2</text>
<text class="h"  x="66" y="198">Score any plan</text>
<text class="sm" x="182" y="198">multi-criteria evaluation</text>

<g transform="translate(0,210)">
  <rect class="box" x="0" y="10" width="150" height="46"/>
  <text class="n" x="10" y="30">Economic</text>
  <text class="sm" x="10" y="46">discounted cash flow, 5 and 20 yr</text>

  <rect class="box" x="0" y="62" width="150" height="46"/>
  <text class="n" x="10" y="82">Environmental</text>
  <text class="sm" x="10" y="98">soil, water, biodiversity, air</text>

  <rect class="box" x="0" y="114" width="150" height="40"/>
  <text class="n" x="10" y="132">Community</text>
  <text class="sm" x="10" y="148">employment, volunteering</text>

  <path class="e" d="M 150 33 C 186 33 186 82 214 82"/>
  <path class="e" d="M 150 85 L 214 85"/>
  <path class="e" d="M 150 134 C 186 134 186 88 214 88"/>
  <path class="e" d="M 208 81 L 214 85 L 208 89"/>

  <rect class="acc" x="214" y="62" width="130" height="46"/>
  <text class="n" x="224" y="82">Weights by AHP</text>
  <text class="sm" x="224" y="98">pairwise, consistency checked</text>

  <path class="e" d="M 344 85 L 380 85"/><path class="e" d="M 374 81 L 380 85 L 374 89"/>

  <rect class="box" x="380" y="62" width="120" height="46"/>
  <text class="n" x="390" y="82">Plan score</text>
  <text class="sm" x="390" y="98">one number per plan</text>
</g>

<line class="rule" x1="0" y1="382" x2="760" y2="382"/>

<!-- ================= STAGE 3 ================= -->
<text class="st" x="0" y="406">STAGE 3</text>
<text class="h"  x="66" y="406">Search the combinations</text>
<text class="sm" x="238" y="406">genetic algorithm</text>

<g transform="translate(0,416)">
  <rect class="box" x="0" y="10" width="118" height="40"/>
  <text class="n" x="10" y="28">Population</text>
  <text class="sm" x="10" y="42">candidate zonings</text>

  <path class="e" d="M 118 30 L 152 30"/><path class="e" d="M 146 26 L 152 30 L 146 34"/>

  <rect class="acc" x="152" y="10" width="118" height="40"/>
  <text class="n" x="162" y="28">Fitness</text>
  <text class="sm" x="162" y="42">the stage-2 score</text>

  <path class="e" d="M 270 30 L 304 30"/><path class="e" d="M 298 26 L 304 30 L 298 34"/>

  <rect class="box" x="304" y="10" width="150" height="40"/>
  <text class="n" x="314" y="28">Keep elite, cross, mutate</text>
  <text class="sm" x="314" y="42">swap zones between good plans</text>

  <path class="e" d="M 454 30 L 488 30"/><path class="e" d="M 482 26 L 488 30 L 482 34"/>
  <rect class="box" x="488" y="10" width="110" height="40"/>
  <text class="n" x="498" y="28">Next generation</text>
  <text class="sm" x="498" y="42">until converged</text>

  <path class="e" d="M 543 50 C 543 66 59 66 59 50"/>
  <path class="e" d="M 55 44 L 59 50 L 63 44"/>
</g>

<text class="cap" x="0" y="494">Schematic of the method. Zone areas are the model's own output; the segmentation image itself is in the competition report.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How the timetabler separates hard constraints from soft ones</title>
<desc id="d">Hard constraints are enforced by conflict-resolution logic before scoring, so every candidate the algorithm considers is a valid timetable. Soft criteria are scored in the fitness function instead of enforced, which keeps the trade-offs between them visible.</desc>
<style>
  .h{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#1c1b19}
  .st{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:700;fill:#a07d1f}
  .n{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:11px;fill:#1c1b19}
  .sm{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#6b6763}
  .cap{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:10px;fill:#8c877f;font-style:italic}
  .box{fill:#fdfcfa;stroke:#1c1b19;stroke-width:1.2}
  .gate{fill:#f2e2bb;stroke:#a07d1f;stroke-width:1.4}
  .soft{fill:#f0ede7;stroke:#b3ada2;stroke-width:1}
  .e{fill:none;stroke:#b3ada2;stroke-width:1.1}
  .eb{fill:none;stroke:#a07d1f;stroke-width:1.3}
  .rule{stroke:#e6e1d8;stroke-width:1}
</style>

<text class="h" x="0" y="14">Hard constraints filter; soft criteria score</text>
<text class="sm" x="288" y="14">gathered from interviews with school administrators before any modelling</text>

<!-- ===== candidate ===== -->
<rect class="box" x="0" y="40" width="150" height="46"/>
<text class="n"  x="12" y="60">Candidate timetable</text>
<text class="sm" x="12" y="76">one assignment of classes</text>

<path class="e" d="M 150 63 L 190 63"/><path class="e" d="M 184 59 L 190 63 L 184 67"/>

<!-- ===== hard gate ===== -->
<rect class="gate" x="190" y="28" width="200" height="70"/>
<text class="st" x="202" y="48">4 HARD CONSTRAINTS</text>
<text class="sm" x="202" y="66">no double-booked room,</text>
<text class="sm" x="202" y="79">no teacher in two places,</text>
<text class="sm" x="202" y="92">and two more like them</text>

<!-- repair loop -->
<path class="eb" d="M 290 98 C 290 126 66 126 66 90"/>
<path class="eb" d="M 62 84 L 66 90 L 70 84"/>
<text class="st" x="120" y="140">violation → repaired, not scored</text>
<text class="sm" x="120" y="154">conflict-resolution logic rewrites the clash away</text>

<path class="e" d="M 390 63 L 430 63"/><path class="e" d="M 424 59 L 430 63 L 424 67"/>

<rect class="box" x="430" y="40" width="150" height="46"/>
<text class="n"  x="442" y="60">Valid timetable</text>
<text class="sm" x="442" y="76">always feasible by here</text>

<line class="rule" x1="0" y1="178" x2="760" y2="178"/>

<!-- ===== soft scoring ===== -->
<text class="st" x="0" y="204">8 SOFT CRITERIA</text>
<text class="h"  x="140" y="204">scored, never enforced</text>

<rect class="soft" x="0" y="218" width="176" height="58"/>
<text class="n"  x="12" y="238">Classroom utilisation</text>
<text class="sm" x="12" y="254">how full the rooms are</text>
<text class="sm" x="12" y="267">across the day</text>

<rect class="soft" x="188" y="218" width="176" height="58"/>
<text class="n"  x="200" y="238">Walking distance</text>
<text class="sm" x="200" y="254">accumulated by each</text>
<text class="sm" x="200" y="267">person between sessions</text>

<rect class="soft" x="376" y="218" width="176" height="58"/>
<text class="n"  x="388" y="238">Timing preference</text>
<text class="sm" x="388" y="254">subjects placed in the</text>
<text class="sm" x="388" y="267">sessions that suit them</text>

<rect class="soft" x="564" y="218" width="176" height="58" stroke-dasharray="3 3"/>
<text class="n"  x="576" y="238">Five further criteria</text>
<text class="sm" x="576" y="254">weighted lower, gathered</text>
<text class="sm" x="576" y="267">in the same interviews</text>

<!-- converge to fitness -->
<path class="e" d="M 88 276 C 88 300 370 300 370 312"/>
<path class="e" d="M 276 276 C 276 300 370 300 370 312"/>
<path class="e" d="M 464 276 C 464 300 370 300 370 312"/>
<path class="e" d="M 652 276 C 652 300 370 300 370 312"/>
<path class="e" d="M 364 306 L 370 312 L 376 306"/>

<rect class="gate" x="270" y="316" width="200" height="42"/>
<text class="n"  x="282" y="336">One fitness score</text>
<text class="sm" x="282" y="350">the trade-off stays visible, and negotiable</text>

<path class="e" d="M 470 337 L 520 337"/><path class="e" d="M 514 333 L 520 337 L 514 341"/>
<rect class="box" x="520" y="316" width="220" height="42"/>
<text class="n"  x="532" y="336">Select, cross, mutate — adaptive rates</text>
<text class="sm" x="532" y="350">explore early, refine as the population converges</text>

<text class="cap" x="0" y="394">Encoding the soft criteria as constraints instead would have made most timetables infeasible and hidden the trade-offs between</text>
<text class="cap" x="0" y="408">them. Scoring them is what lets the system return several good schedules rather than one.</text>
<text class="cap" x="0" y="430">Schematic of the design. Pilot results are reported in the text.</text>
</svg>
